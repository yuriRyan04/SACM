
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACM - Adicionar Disciplinas ao Professor</title>
    <link rel="stylesheet" href="./styles 11.css">
</head>
<body>

<header class="topo">
    <button class="botao-menu" id="botaoMenu" type="button"
            onclick="abrirMenu()" aria-label="Abrir menu"
            aria-expanded="false">☰</button>

    <div class="logo-sacm">
        <img src="./img/SACM.png" alt="Logo SACM">
    </div>

    <div class="titulo">
        <h2>ADICIONAR DISCIPLINAS AO PROFESSOR</h2>
    </div>

    <div class="logo-ceep">
        <img src="./img/CEEP.png" alt="Logo CEEP">
    </div>
</header>

<div class="container">
    <div class="fundo-menu" id="fundoMenu" onclick="fecharMenu()"></div>

    <aside class="menu" id="menu">
        <div class="perfil">
            <div class="foto-perfil">
                <label for="inputFoto">
                    <img id="fotoUsuario" src="./img/aluno.png" alt="Foto de perfil">
                    <span class="icone-camera">📷</span>
                </label>

                <input type="file" id="inputFoto"
                       accept="image/jpeg,image/png,image/webp">
            </div>

            <div class="dados-perfil">
                <h3 id="nomeUsuario">Carregando...</h3>
                <p>Matrícula: <span id="matriculaUsuario">...</span></p>
            </div>
        </div>

        <div class="separador"></div>

        <div class="home">
            <a href="index.html" title="Início">
                <img src="./img/casa.png" alt="Início">
            </a>

            <a href="gerenciar-disciplinas-professores.html" title="Voltar">
                <img src="./img/seta.png" alt="Voltar">
            </a>
        </div>

        <button
            class="botao-menu-lateral"
            onclick="window.location.href='gerenciar-monitor.html'"
        >
            GERENCIAMENTO DE MONITORES
        </button>

        <button
            class="botao-menu-lateral"
            onclick="window.location.href='gerenciar-disciplinas.html'"
        >
           GERENCIAMENTO DE DISCIPLINAS
        </button>
        <button
            class="botao-menu-lateral"
            onclick="window.location.href='gerenciar-disciplinas-professores.html'"
        >
            GERENCIAMENTO DE DISCIPLINAS PARA PROFESSORES
        </button>
         <button
        class="botao-menu-lateral"
        onclick="window.location.href='creditos-gestao.html'"
    >
        CRÉDITOS DOS CRIADORES
    </button>
    </aside>

    <main class="conteudo">
        <section class="gerenciamento">

            <div class="cabecalho-secao">
                <span class="etiqueta">ÁREA DA GESTÃO</span>
                <h1>ADICIONAR DISCIPLINAS</h1>
                <p>Pesquise o professor pela matrícula e selecione as disciplinas que ele ministra.</p>
            </div>

            <label for="matriculaProfessor">MATRÍCULA DO PROFESSOR:</label>

            <div class="barra-busca-professor">
                <input type="search" id="matriculaProfessor"
                       placeholder="Digite a matrícula do professor..."
                       autocomplete="off">

                <button type="button" id="buscarProfessorMatricula"
                        class="botao botao-principal">
                    BUSCAR
                </button>
            </div>

            <p id="mensagemBusca" class="mensagem"
               role="status" aria-live="polite"></p>

            <div id="dadosProfessor" class="dados-professor" hidden>
                <div class="avatar-professor" id="iniciaisProfessor">PR</div>

                <div>
                    <h3 id="nomeProfessor">Professor</h3>
                    <p>Matrícula: <strong id="matriculaEncontrada"></strong></p>
                </div>
            </div>

            <div id="painelDisciplinas" hidden>

                <h2 class="titulo-lista-disciplinas">
                    Disciplinas disponíveis
                </h2>

                <label for="filtroArea">FILTRAR POR ÁREA:</label>

                <select id="filtroArea">
                    <option value="">Todas as áreas</option>
                </select>

                <label for="pesquisaDisciplina">PESQUISAR DISCIPLINA:</label>

                <input type="search" id="pesquisaDisciplina"
                       placeholder="Digite o nome da disciplina...">

                <div class="barra-selecao">
                    <span>
                        Selecionadas:
                        <strong id="contadorDisciplinas">0</strong>
                    </span>

                    <button type="button" id="selecionarVisiveis"
                            class="botao botao-secundario">
                        SELECIONAR VISÍVEIS
                    </button>

                    <button type="button" id="limparSelecao"
                            class="botao botao-secundario">
                        LIMPAR SELEÇÃO
                    </button>
                </div>

                <p id="mensagemDisciplinas" class="mensagem"
                   role="status" aria-live="polite"></p>

                <div id="listaDisciplinas" class="lista-disciplinas">
                    <p class="estado-vazio">
                        Pesquise um professor primeiro.
                    </p>
                </div>

                <div class="acoes-finais">
                    <button type="button" id="cancelarEdicao"
                            class="botao botao-secundario">
                        VOLTAR
                    </button>

                    <button type="button" id="salvarDisciplinas"
                            class="botao botao-principal">
                        SALVAR DISCIPLINAS
                    </button>
                </div>

            </div>
        </section>
    </main>
</div>

<script src="./js/adicionar-disciplinas-professor.js" defer></script>
<script src="./js/menu.js" defer></script>
<script src="./js/perfil.js" defer></script>

</body>
</html>
