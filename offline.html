
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06093E">

    <title>SACM - Sem conexão</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #ffffff;
            background: #06093E;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 35px 25px;
            text-align: center;
            background: #101b50;
            border: 1px solid #344577;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 110px;
            max-width: 100%;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 26px;
        }

        p {
            margin-bottom: 24px;
            color: #d9e1ff;
            font-size: 16px;
            line-height: 1.7;
        }

        button {
            padding: 13px 22px;
            border: none;
            border-radius: 9px;
            background: #900E01;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b51b0b;
        }

        .aviso {
            margin-top: 20px;
            margin-bottom: 0;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="container">
        <img
            src="./img/SACM.png"
            alt="Logo SACM"
            class="logo"
        >

        <h1>Sem conexão com o servidor</h1>

        <p>
            Não foi possível acessar o SACM neste momento.
            Verifique sua conexão com a rede da escola
            e tente novamente.
        </p>

        <button type="button" onclick="window.location.reload()">
            Tentar novamente
        </button>

        <p class="aviso">
            Seus agendamentos e demais informações continuam
            dependendo da conexão com o servidor.
        </p>
    </main>
</body>
</html>
