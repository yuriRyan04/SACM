
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACM - Cadastro de Professores</title>
    <link rel="stylesheet" href="./styles 10.css">
</head>
<body>

<header class="topo">

    <div class="logo-sacm">
        <img src="./img/SACM.png" alt="Logo SACM">
    </div>

    <div class="titulo">
        <h2>CADASTRO DE PROFESSORES</h2>
    </div>

    <div class="logo-ceep">
        <img src="./img/CEEP.png" alt="Logo CEEP">
    </div>
</header>


<main class="conteudo">

    <section class="painel-cadastro">
        <h2>Cadastrar Professor</h2>

        <p class="descricao">
            Preencha os dados do professor para realizar o cadastro
            no Sistema de Auxílio e Controle de Monitoria.
            A senha inicial será gerada automaticamente a partir do CPF.
        </p>

        <form id="formCadastroProfessor">

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite o nome completo"
                    maxlength="150"
                    autocomplete="name"
                    required>
            </div>

            <div class="campo">
                <label for="matricula">Matrícula</label>
                <input
                    type="text"
                    id="matricula"
                    name="matricula"
                    placeholder="Digite a matrícula"
                    maxlength="30"
                    inputmode="numeric"
                    autocomplete="off"
                    required>
            </div>

            <div class="campo">
                <label for="cpf">CPF do professor</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00"
                    maxlength="14"
                    inputmode="numeric"
                    autocomplete="off"
                    aria-describedby="ajudaCpf"
                    required>

                <small id="ajudaCpf">
                    Digite o CPF com pontos e traço.
                    A senha inicial será ceep@ seguida do CPF.
                </small>
            </div>

            <div id="mensagem"
                class="mensagem"
                role="status"
                aria-live="polite"></div>

            <div class="botoes-formulario">
                <button
                    type="submit"
                    id="btnCadastrar"
                    class="botao-cadastrar">
                    Cadastrar Professor
                </button>

                <button
                    type="reset"
                    id="btnLimpar"
                    class="botao-limpar">
                    Limpar
                </button>
            </div>

        </form>
    </section>

</main>

<script src="./js/menu.js" defer></script>
<script src="./js/cadastro-professores.js" defer></script>
<script src="./js/perfil.js" defer></script>

</body>
</html>
